name: Release

# Pushing a version tag (the /release skill does this) publishes the library in
# packages/map-views and the plugin in packages/sctx-map-views to npm at the same version.
# The repo root is a private workspace and is never published.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    # npm's trusted publisher config for this package names this workflow and environment.
    environment: npm
    permissions:
      contents: write # GitHub release
      id-token: write # npm trusted publishing and provenance
      attestations: write # artifact attestation of the tarball
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # Trusted publishing needs npm 11.5.1 or later, which Node 24 ships.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Check the tag matches both packages
        run: |
          for pkg in map-views sctx-map-views; do
            v=$(jq -r .version "packages/$pkg/package.json")
            if [ "$GITHUB_REF_NAME" != "v$v" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match packages/$pkg version $v"
              exit 1
            fi
          done
      - run: bun install --frozen-lockfile
      - run: bun run build
      # Pack once, so the tarballs that are attested are the ones published and attached.
      - name: Pack
        id: pack
        run: |
          tarballs=""
          for pkg in map-views sctx-map-views; do
            tarballs="$tarballs $(cd "packages/$pkg" && npm pack --ignore-scripts --silent --pack-destination "$RUNNER_TEMP")"
          done
          echo "dir=$RUNNER_TEMP" >>"$GITHUB_OUTPUT"
          echo "tarballs=${tarballs# }" >>"$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ steps.pack.outputs.dir }}/*.tgz
      - name: Publish to npm
        run: for t in $TARBALLS; do npm publish "$DIR/$t" --provenance --access public; done
        env:
          DIR: ${{ steps.pack.outputs.dir }}
          TARBALLS: ${{ steps.pack.outputs.tarballs }}
      - name: Create the GitHub release
        run: gh release create "$GITHUB_REF_NAME" $(for t in $TARBALLS; do echo "$DIR/$t"; done) --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          DIR: ${{ steps.pack.outputs.dir }}
          TARBALLS: ${{ steps.pack.outputs.tarballs }}
